name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # One sequential job: every step depends on the same install, and a failure
  # in any early gate should stop the rest — splitting into parallel jobs
  # would only multiply install time.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # The browser layer needs a Chromium binary; cache it on the exact
      # Playwright version so most runs skip the ~130 MB download.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Reuses the .next build from the Build step for the production server;
      # the console harness starts its own dev server (see playwright.config.ts).
      - name: Browser tests
        run: npm run test:e2e
