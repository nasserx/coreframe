name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # One sequential job: every step depends on the same install, and a failure
  # in any early gate should stop the rest — splitting into parallel jobs
  # would only multiply install time.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
