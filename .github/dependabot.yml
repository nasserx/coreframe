# Dependency updates.
#
# Dependabot (not Renovate) is chosen deliberately: it is native to GitHub, so a
# repository created from this template inherits working automation from its
# first day with zero external setup. Renovate is more capable (richer grouping,
# auto-merge), but it requires installing and authorizing the Renovate GitHub App
# on every clone — friction that contradicts this foundation's "works on the
# first PR of a fresh clone, no configuration" posture (see docs/CLONING.md §3).
#
# Anti-flood measures, because a template must not greet its owner with a wall of
# PRs: a weekly cadence, and grouped updates so routine minor/patch bumps arrive
# as at most a few PRs per week instead of one per package. Majors are NOT grouped
# (they deserve individual review) but are capped by the open-PR limit. Commit
# messages use a Conventional-Commits prefix to satisfy this repo's commitlint.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # --- Lint/type toolchain: majors are held until eslint-config-next ---
      #
      # SHARED ROOT CAUSE (applies to every entry below): `eslint-config-next`
      # bundles its OWN copies of the lint/type plugins (eslint-plugin-react,
      # eslint-plugin-import, @typescript-eslint/*, ...). Our lint stack therefore
      # moves at eslint-config-next's pace, not ours: a major bump of the *host*
      # tool (eslint, typescript) that lands ahead of the bundled plugins breaks
      # `npm run lint`/`typecheck` in CI even though our own code is fine. Majors
      # here ride in on a Next.js major (which upgrades eslint-config-next and its
      # bundled plugins together) — never on their own. Minor/patch keep flowing.
      # Full rationale + revisit signals: docs/ROADMAP.md "Deferred tooling upgrades".
      #
      # TypeScript 6/7 — blocked on typescript-eslint's peer range (<6.1.0). TS 7
      # is a full compiler rewrite (the Go/"native" port); the type-aware lint
      # ecosystem has not caught up. Tracking:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
      # ESLint 10 — its bundled eslint-plugin-react calls context.getFilename(),
      # removed in ESLint 10 (rule load crashes CI). Held until eslint-config-next
      # ships plugins built for ESLint 10.
      - dependency-name: "eslint"
        update-types:
          - version-update:semver-major
      # Defensive: if any of these plugins is ever promoted to a DIRECT dep, its
      # major is held for the same reason (today they arrive transitively, pinned
      # by eslint-config-next, so Dependabot does not PR them directly).
      - dependency-name: "eslint-plugin-*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@typescript-eslint/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "typescript-eslint"
        update-types:
          - version-update:semver-major
    groups:
      # Routine production bumps collapse into one PR.
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      # Routine tooling/test/build bumps collapse into another.
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Keep the CI workflow's actions current (same cadence, one grouped PR).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
